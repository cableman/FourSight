name: CI

# The cross-platform claim is only as good as the matrix, so Windows runs from M0 onward
# rather than being discovered at M5 (PLAN.md § Tech Stack).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail on warnings that would otherwise scroll past in a green log.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONWARNINGS: "default"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      # build.py has no unit tests; --dry-run at least catches an argv or syntax regression.
      - name: build script sanity
        run: python scripts/build.py --dry-run

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red leg must not hide the state of the others — that is the point of a matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 wheels on Linux need these to *import*, not just to install. Harmless while
      # gui/ is stubs; required from T2.7 when it actually imports Qt. Cheaper to have the
      # step already correct than to debug an ImportError in a matrix leg later.
      - name: system Qt/GL libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - run: python -m pip install -e ".[dev,gui]"
      - name: pytest
        # -rs prints skip *reasons*. Without it a platform-specific silent skip is invisible: the
        # console-script test looked in the wrong directory on Windows and skipped there for eleven
        # commits, on the one platform where a console-script shim is most likely to be what breaks.
        run: python -m pytest -q -rs
        env:
          # PLAN.md requires >= 50k lines/sec, and that requirement stands for real hardware — this
          # machine reaches 95k. GitHub's shared 2-vCPU runners measure 47-50k, so all four legs sit
          # on top of the threshold and three of them failed while one passed by 0.4%. That is a
          # coin flip, not a regression test. Overriding here keeps PLAN's number as the product
          # requirement while still catching a genuine halving; lowering PLAN instead would let CI
          # hardware dictate the requirement. T1.12's docstring specifies exactly this remedy.
          FOURSIGHT_PERF_MIN_RATE: "30000"

  # The enforcement mechanism for "every module outside gui/ imports without Qt".
  # Installs [dev] ONLY: if a headless module grows a Qt import, this job fails while the
  # matrix above stays green, because there Qt is present and the mistake is invisible.
  headless:
    name: headless (no Qt installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"

      - name: assert Qt really is absent
        # Guards the guard: if PySide6 ever arrives as a transitive dependency, the gui tests
        # would stop skipping and this job would silently stop proving anything.
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [n for n in ("PySide6", "pyqtgraph", "OpenGL") if importlib.util.find_spec(n)]
          if present:
              sys.exit(f"[dev] install pulled in Qt/GL: {present} — this job no longer proves anything")
          print("Qt/GL absent, as required")
          PY

      - name: pytest (gui tests skip, headless tests must pass)
        run: python -m pytest -q -rs
        env:
          FOURSIGHT_PERF_MIN_RATE: "30000"  # same shared-runner allowance as the matrix job

      - name: CLI must work without Qt
        # foursight check is an M1 deliverable and must never need the [gui] extra.
        run: |
          python - <<'PY'
          import importlib, sys
          cli = importlib.import_module("foursight.cli")
          leaked = sorted(m for m in sys.modules if m.split(".")[0] in {"PySide6", "pyqtgraph", "OpenGL"})
          if leaked:
              sys.exit(f"importing foursight.cli pulled in {leaked}")
          print("foursight.cli imports clean without Qt")
          PY
