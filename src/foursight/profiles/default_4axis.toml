#
# FourSight machine profile — generic 4-axis mill (XYZ + A rotary table).
#
# This is the default profile. Copy it and edit for a real machine; the values here are plausible
# rather than authoritative.
#
# Anything omitted is treated as UNKNOWN, not as zero, and the corresponding check is skipped or
# downgraded rather than run against an invented value. That is deliberate: a confident diagnostic
# about a machine we know nothing about is worse than no diagnostic.
#

[machine]
name = "Generic 4-axis mill"
units = "mm" # units the values in THIS file are expressed in ("mm" or "inch")

# The controller this profile describes. LinuxCNC is normative; anything else is a documented
# deviation (PLAN.md § Dialect Divergences). Selecting a dialect never adds or removes supported
# G-codes — it only changes what is listed there.
#
# The two keys below it are controller *configuration*: settings that appear nowhere in the G-code,
# so a program cannot tell us and we must not guess. They are meaningful only under a dialect that
# treats them as settings, and the profile refuses to load if one is set where it is not.
[dialect]
name = "linuxcnc" # "linuxcnc" | "mach3"

# mach3 only — Mach3's Config → General "IJ Mode" radio button. With "absolute", an arc's I/J are
# the centre's coordinates rather than an offset from the start point, and getting this wrong draws
# every unqualified arc in the program wrongly with no diagnostic. A program that states G90.1 or
# G91.1 itself overrides this; it sets the starting mode, not a lock.
# arc_centre = "incremental" # "incremental" (G91.1) | "absolute" (G90.1)

# mach3 only — G4 P is seconds on both controllers, but some Mach3 posts emit milliseconds. Never
# inferred from the magnitude of P: a 90-second tool-cooling dwell is legitimate, and rescaling it
# to 0.09 s on a hunch is exactly the confidently-wrong output this tool refuses.
# dwell_units = "seconds" # "seconds" | "milliseconds"

[limits]
max_feed = 3000.0        # mm/min
max_spindle_rpm = 24000.0
# mm/min above which a straight-down G1 plunge is reported. Left unset on purpose: a sane plunge rate
# is a property of the tool and the material, not of the machine, so this generic profile has no
# honest number to put here. Set it per job and the check switches on.
# Ramps and helical entries are never reported — only blocks that move Z alone.
# max_plunge_feed = 300.0
# Degrees of rotary travel in one block before warning. Multi-turn wrapping is legitimate, so this
# is tunable; 0 would warn on any rotary move at all.
rotary_wrap_warn = 360.0

[tolerance]
arc_radius_mismatch = 0.005 # mm — |r_start - r_end| above this is an error
arc_chord = 0.01            # mm — max chord deviation when tessellating arcs
rotary_chord = 0.01         # mm — same, measured at max path radius from the centerline

[axes.x]
min = 0.0
max = 400.0
max_rapid = 5000.0 # mm/min

[axes.y]
min = 0.0
max = 300.0
max_rapid = 5000.0 # mm/min

[axes.z]
# Machine Z, with the g54 origin at 0. The positive headroom is not cosmetic: `min_clearance_z`
# below requires rapids to stay above Z+5, so a Z range capping at 0.0 would make every possible
# program non-compliant — there would be nowhere legal to retract to.
min = -150.0
max = 100.0
max_rapid = 3000.0 # mm/min

# `home` is the machine position each axis returns to under G28/G30. It is machine-specific and
# appears nowhere in the G-code, so it is left unset here: an unset home means a G28 move is NOT
# drawn, rather than drawn to a guessed point. Set it per machine to see reference moves.
# Example for this generic mill:
#   [axes.x] home = 0.0   /   [axes.y] home = 0.0   /   [axes.z] home = 100.0

[axes.a]
type = "rotary"
wrap = true        # 0-360 wraparound; when false, min/max below are enforced
min = -360.0
max = 360.0
max_rapid = 3600.0 # deg/min

# The next key describes the CONTROL, not the axis, and it appears nowhere in the G-code — only this
# file can state it. Mach3's "Ang Short Rot on G0" (<ShortRot>1< in the profile XML), and equivalents
# elsewhere, make a rapid reach the commanded angle by the shorter of the two directions. Under a half
# turn that is the place the program asked for. Over a half turn it is not: the axis stops a full turn
# away and reports that as its position, and the next block commanding an absolute angle makes the
# whole turn up — cutting a complete circle round the part if it happens to be in the material.
# Reported by process.rotary-rapid-short-rotates. Needs wrap, since the premise is that an angle and
# that angle plus a turn are the same place. Set it to match the machine, not to quieten the rule.
short_rotate = false

# Work offsets are NOT in the G-code file — they live in the controller. Without them the
# travel-limit check cannot run in machine coordinates, so any offset left unset makes limit
# violations WARNINGS ("assumes zero offset") rather than errors.
#
# Note the distinction: `g54 = [0, 0, 0, 0]` means "set, and it is zero". Commenting the line out
# means "unknown". Those are different, and the verifier treats them differently.
#
# The fourth component is A in DEGREES; the first three are lengths in this file's units.
[offsets]
g54 = [0.0, 0.0, 0.0, 0.0]
# g55 = [0.0, 0.0, 0.0, 0.0]
# g56 = ...

[kinematics]
rotary_mount = "table" # "table" (part rotates) | "head" (tool swings)
rotary_axis = "x"      # A rotates about machine X
# Point the rotary axis passes through. For rotary_axis = "x" only the Y and Z components are
# meaningful; the X term cancels through the rotation.
centerline_offset = [0.0, 0.0, 50.0]
# Required when rotary_mount = "head": distance from the swing pivot to the tool tip. The tip
# translates as the head swings, so the profile will refuse to load without it.
# pivot_to_tip = 120.0

[safety]
min_clearance_z = 5.0 # rapids below this → warning
require_spindle_before_cut = true
retract_before_toolchange = true

# Where the stock sits, so a rapid that would pass through it can be reported. Stated in MACHINE
# coordinates — the same frame as [axes] and [offsets] above, because that is the frame verification
# runs in. With g54 = [0, 0, 0, 0] the two coincide.
#
# Left unset here because a shipped profile cannot know what is clamped to the table today. Every key
# of the shape is required together: the profile refuses to load with only some of them, rather than
# completing one by a guess and then reporting on a solid that is not the one you have.
#
# This is not a material-removal model, so a rapid through material an earlier pass already cleared is
# reported too — that is why the finding is a warning.
#
# There are two shapes, and `shape` may be omitted because it is inferred from the keys present.
#
#   shape = "box"       needs  min  and  max            — prismatic work
#   shape = "cylinder"  needs  diameter, length, axis_min  — a blank on the rotary axis
#
# For 4-axis work use the CYLINDER. Its axis is deliberately NOT stated here: it is
# [kinematics].rotary_axis through [kinematics].centerline_offset above. A cylinder concentric with the
# rotary axis maps onto itself under any A rotation, so the check stays exact at every angle — whereas a
# fixed BOX stops describing stock that turns with the part, and a program that moves A then gets one
# diagnostic saying the envelope cannot be judged instead of per-rapid findings. An off-axis cylinder
# would have the same problem, which is why it cannot be expressed. `axis_min` is the machine coordinate
# of the end of the blank nearer the rotary axis's minimum.
#
# Every key of the chosen shape is required, and a key from the other shape is refused rather than
# ignored — one that looks configured and does nothing is the worst of the three outcomes.
#
# The box example below is switchable as it stands; for a cylinder, replace its two corner lines.
#
# [tool] is the cutter the SOLID VIEW carves the blank with, and nothing else. No verifier reads it:
# every rule judges the programmed centreline, and giving the cutter a width would quietly change what
# several of them mean — a travel limit measured against a tool edge rather than the spindle centre is a
# different check, not a better one.
#
# Left unset for the same reason [stock] is: a shipped profile cannot know what is in the spindle. Unset
# means the solid view is unavailable and says why, rather than carving with a guessed 6 mm end mill and
# producing a shaded, authoritative-looking part of entirely the wrong shape.
#
# THERE IS NO TOOL TABLE. It is one cutter for the whole program — T words are numbers that nothing
# resolves to geometry — so a program that changes tools is carved wrongly wherever the other tool cut.
# The solid view reports that rather than hiding it.
#
# Only the cutter's bottom matters to a heightfield. A "flat" tool reaches its tip depth everywhere
# inside the radius; a "ball" tool reaches radius - sqrt(radius^2 - d^2) above the tip, d from the axis.
#
# BOTH SWITCHABLE BLOCKS BELOW ARE DELIBERATELY BARE, and every word explaining them is up here. The GUI
# profile editor switches a whole section on by uncommenting its header and every `key = value` line
# under it, and "under it" runs to the next section header — so a prose line shaped like an assignment,
# sitting between a header and the next one, would be uncommented into a file that is not valid TOML.
# Keep explanations above this point.
# [stock]
# min = [0.0, 0.0, -20.0]
# max = [100.0, 80.0, 0.0]
# [tool]
# diameter = 6.0
# shape = "flat"
