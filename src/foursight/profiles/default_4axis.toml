#
# FourSight machine profile — generic 4-axis mill (XYZ + A rotary table).
#
# This is the default profile. Copy it and edit for a real machine; the values here are plausible
# rather than authoritative.
#
# Anything omitted is treated as UNKNOWN, not as zero, and the corresponding check is skipped or
# downgraded rather than run against an invented value. That is deliberate: a confident diagnostic
# about a machine we know nothing about is worse than no diagnostic.
#

[machine]
name = "Generic 4-axis mill"
units = "mm" # units the values in THIS file are expressed in ("mm" or "inch")

# The controller this profile describes. LinuxCNC is normative; anything else is a documented
# deviation (PLAN.md § Dialect Divergences). Selecting a dialect never adds or removes supported
# G-codes — it only changes what is listed there.
#
# The two keys below it are controller *configuration*: settings that appear nowhere in the G-code,
# so a program cannot tell us and we must not guess. They are meaningful only under a dialect that
# treats them as settings, and the profile refuses to load if one is set where it is not.
[dialect]
name = "linuxcnc" # "linuxcnc" | "mach3"

# mach3 only — Mach3's Config → General "IJ Mode" radio button. With "absolute", an arc's I/J are
# the centre's coordinates rather than an offset from the start point, and getting this wrong draws
# every unqualified arc in the program wrongly with no diagnostic. A program that states G90.1 or
# G91.1 itself overrides this; it sets the starting mode, not a lock.
# arc_centre = "incremental" # "incremental" (G91.1) | "absolute" (G90.1)

# mach3 only — G4 P is seconds on both controllers, but some Mach3 posts emit milliseconds. Never
# inferred from the magnitude of P: a 90-second tool-cooling dwell is legitimate, and rescaling it
# to 0.09 s on a hunch is exactly the confidently-wrong output this tool refuses.
# dwell_units = "seconds" # "seconds" | "milliseconds"

[limits]
max_feed = 3000.0        # mm/min
max_spindle_rpm = 24000.0
# Degrees of rotary travel in one block before warning. Multi-turn wrapping is legitimate, so this
# is tunable; 0 would warn on any rotary move at all.
rotary_wrap_warn = 360.0

[tolerance]
arc_radius_mismatch = 0.005 # mm — |r_start - r_end| above this is an error
arc_chord = 0.01            # mm — max chord deviation when tessellating arcs
rotary_chord = 0.01         # mm — same, measured at max path radius from the centerline

[axes.x]
min = 0.0
max = 400.0
max_rapid = 5000.0 # mm/min

[axes.y]
min = 0.0
max = 300.0
max_rapid = 5000.0 # mm/min

[axes.z]
# Machine Z, with the g54 origin at 0. The positive headroom is not cosmetic: `min_clearance_z`
# below requires rapids to stay above Z+5, so a Z range capping at 0.0 would make every possible
# program non-compliant — there would be nowhere legal to retract to.
min = -150.0
max = 100.0
max_rapid = 3000.0 # mm/min

# `home` is the machine position each axis returns to under G28/G30. It is machine-specific and
# appears nowhere in the G-code, so it is left unset here: an unset home means a G28 move is NOT
# drawn, rather than drawn to a guessed point. Set it per machine to see reference moves.
# Example for this generic mill:
#   [axes.x] home = 0.0   /   [axes.y] home = 0.0   /   [axes.z] home = 100.0

[axes.a]
type = "rotary"
wrap = true        # 0-360 wraparound; when false, min/max below are enforced
min = -360.0
max = 360.0
max_rapid = 3600.0 # deg/min

# Work offsets are NOT in the G-code file — they live in the controller. Without them the
# travel-limit check cannot run in machine coordinates, so any offset left unset makes limit
# violations WARNINGS ("assumes zero offset") rather than errors.
#
# Note the distinction: `g54 = [0, 0, 0, 0]` means "set, and it is zero". Commenting the line out
# means "unknown". Those are different, and the verifier treats them differently.
#
# The fourth component is A in DEGREES; the first three are lengths in this file's units.
[offsets]
g54 = [0.0, 0.0, 0.0, 0.0]
# g55 = [0.0, 0.0, 0.0, 0.0]
# g56 = ...

[kinematics]
rotary_mount = "table" # "table" (part rotates) | "head" (tool swings)
rotary_axis = "x"      # A rotates about machine X
# Point the rotary axis passes through. For rotary_axis = "x" only the Y and Z components are
# meaningful; the X term cancels through the rotation.
centerline_offset = [0.0, 0.0, 50.0]
# Required when rotary_mount = "head": distance from the swing pivot to the tool tip. The tip
# translates as the head swings, so the profile will refuse to load without it.
# pivot_to_tip = 120.0

[safety]
min_clearance_z = 5.0 # rapids below this → warning
require_spindle_before_cut = true
retract_before_toolchange = true
